name: Build Atoll update

on:
  push:
    branches: [build/atoll-dmg]

permissions:
  contents: read

jobs:
  update:
    runs-on: macos-26-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Verify project checks
        run: python3 -m unittest tests.test_privacy_configuration tests.test_timer_lifecycle

      - name: Install Metal toolchain
        run: |
          sudo xcodebuild -runFirstLaunch
          for attempt in 1 2 3; do
            if xcodebuild -downloadComponent MetalToolchain; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep 10; fi
          done
          exit 1

      - name: Build for Apple silicon
        run: |
          xcodebuild build \
            -project DynamicIsland.xcodeproj \
            -scheme DynamicIsland \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            PRODUCT_BUNDLE_IDENTIFIER=com.toxicornot.Atoll \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=YES

      - name: Package and verify the app update
        run: |
          app='build/Build/Products/Release/Atoll.app'
          plist="$app/Contents/Info.plist"
          test -f "$plist"
          if /usr/libexec/PlistBuddy -c 'Print :SUFeedURL' "$plist" >/dev/null 2>&1; then
            /usr/libexec/PlistBuddy -c 'Delete :SUFeedURL' "$plist"
          fi
          plutil -replace SUEnableAutomaticChecks -bool false "$plist"
          codesign --force --sign - --preserve-metadata=entitlements,flags "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          lipo "$app/Contents/MacOS/Atoll" -verify_arch arm64

          mkdir -p build/dist build/verify
          archive=build/dist/Atoll-ToxicOrNot-update.zip
          ditto -c -k --sequesterRsrc --keepParent "$app" "$archive"
          ditto -x -k "$archive" build/verify
          codesign --verify --deep --strict build/verify/Atoll.app
          shasum -a 256 "$archive" build/verify/Atoll.app/Contents/MacOS/Atoll

      - name: Upload the app update
        uses: actions/upload-artifact@v4
        with:
          name: Atoll-ToxicOrNot-update
          path: build/dist/Atoll-ToxicOrNot-update.zip
          if-no-files-found: error
          retention-days: 30
